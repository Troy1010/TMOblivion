;This mod does nothing outside of the features defined here, so you can enable or disable each part you wish.

;==== Feature: DelayDrinks
; Set to 0 to disable this feature.
set QstDD.featureDelayDrinks to 1
; How long do you need to press the button before the action is finished?
set QstDD.fDelayTime to 1.6

;==== Feature: PassOutPotions
set QstDD.featurePassOutPotions to 1

;==== Applies to all features
; Set to 1 to see logs from the game console. Either way, the log text files are still written to.
set QstDD.bPrintToConsole to 0
; Set to 1 to see logs that might happen every fraction of a second.
set QstDD.bShouldLogFlooding to 0